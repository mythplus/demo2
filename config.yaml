# ============================================
# Mem0 Dashboard 配置文件
# 修改此文件后，前端"系统设置"页面刷新即可同步显示最新配置
# 注意：修改 LLM/Embedder/向量数据库/图数据库 配置后需要重启后端服务才能生效于实际业务
# 支持环境变量替换：使用 ${ENV_VAR_NAME} 格式引用环境变量
# ============================================

# LLM 大语言模型配置
llm:
  provider: "ollama"
  config:
    model: "qwen2.5:7b"
    ollama_base_url: "http://9.134.231.238:11434"
    temperature: 0.1

# Embedder 嵌入模型配置
embedder:
  provider: "ollama"
  config:
    model: "nomic-embed-text"
    ollama_base_url: "http://9.134.231.238:11434"

# 向量数据库配置
vector_store:
  provider: "qdrant"
  config:
    collection_name: "mem0"
    embedding_model_dims: 768
    on_disk: true

# 图数据库配置
graph_store:
  provider: "neo4j"
  config:
    url: "bolt://9.134.231.238:7687"
    username: "neo4j"
    password: "mem0_neo4j_2024"

# 安全配置
security:
  # API Key 认证（为空则不启用认证，建议生产环境必须设置）
  api_key: ""
  # CORS 允许的来源（逗号分隔，* 表示允许所有）
  cors_origins: "http://localhost:3000,http://127.0.0.1:3000"
  # 速率限制（每分钟最大请求数，0 表示不限制）
  rate_limit: 60

# ============================================
# 多租户系统配置
# ============================================

# 认证配置
auth:
  # 是否启用认证（false 时跳过所有认证中间件，方便开发调试）
  enabled: false
  # JWT 密钥（生产环境务必修改为随机长字符串）
  jwt_secret: "mem0-dashboard-jwt-secret-change-in-production-2026"
  # JWT 访问令牌有效期（小时）
  access_token_expire_hours: 24
  # JWT 刷新令牌有效期（天）
  refresh_token_expire_days: 7
  # 默认管理员账号（首次启动时自动创建）
  default_admin_username: "admin"
  default_admin_password: "admin123456"

# Redis 配置（速率限制 + 配额计数）
redis:
  host: "9.134.231.238"
  port: 6379
  db: 0
  password: ""
  # 连接超时（秒）
  socket_timeout: 5

# 配额管理
quota:
  # 默认配额上限（新创建租户的初始值）
  default_max_memories: 10000
  default_max_api_calls_per_day: 5000
  # 是否启用配额检查
  enabled: true

# 速率限制（多租户级，覆盖 security.rate_limit）
rate_limit:
  # 是否启用租户级速率限制
  enabled: true
  # 每分钟最大请求数（按租户）
  per_minute: 120
  # 每小时最大请求数（按租户）
  per_hour: 3600

# 版本号
version: "v2.0"
