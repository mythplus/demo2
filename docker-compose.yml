# ============ 持久化卷 ============
volumes:
  qdrant_data:
    driver: local
  backend_data:
    driver: local
  neo4j_data:
    driver: local
  neo4j_logs:
    driver: local
  # ollama_data:
  #   driver: local

# ============ 网络 ============
networks:
  mem0-net:
    driver: bridge
